$kind: http-request
name: "B no ve el caballo de A (404)"
url: "{{caballos_url}}/api/caballos/{{id_caballo}}"
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_b}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(404);
          pm.expect(b).to.have.property("mensaje");
      });
order: 2000
