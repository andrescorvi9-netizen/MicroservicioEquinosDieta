$kind: http-request
name: "La lista de B no incluye el caballo de A (200)"
url: "{{caballos_url}}/api/caballos?page=0&size=100"
method: GET
queryParams:
  - key: "page"
    value: "0"
  - key: "size"
    value: "100"
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_b}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Sin el caballo de A", function () {
          pm.expect(pm.response.json().contenido.map(c => c.id)).to.not.include(Number(pm.environment.get("id_caballo")));
      });
order: 3000
