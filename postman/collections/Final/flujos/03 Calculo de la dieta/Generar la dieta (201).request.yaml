$kind: http-request
name: "Generar la dieta (201)"
url: "{{dietas_url}}/api/dietas"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "caballoId": {{id_caballo_calc}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Racion 7.21 / 6.85 / 0.36 kg (1.5% del peso, 95/5)", function () {
          const b = pm.response.json();
          pm.expect(b.pesoKg).to.eql(480.5);
          pm.expect(b.racion.materiaSecaTotalKgDia).to.eql(7.21);
          pm.expect(b.racion.forrajeKgDia).to.eql(6.85);
          pm.expect(b.racion.concentradoKgDia).to.eql(0.36);
          pm.expect(b.perfil.porcentajeMateriaSecaDelPeso).to.eql(1.5);
          pm.expect(b.perfil.porcentajeForraje).to.eql(95);
          pm.expect(b.perfil.porcentajeConcentrado).to.eql(5);
      });
order: 2000
