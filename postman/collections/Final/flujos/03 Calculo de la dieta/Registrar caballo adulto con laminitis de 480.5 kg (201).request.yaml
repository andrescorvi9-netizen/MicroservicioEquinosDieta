$kind: http-request
name: "Registrar caballo adulto con laminitis de 480.5 kg (201)"
url: "{{caballos_url}}/api/caballos"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Calculo",
      "codigo": "{{codigo_caballo_calc}}",
      "pesoKg": 480.5,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("codigo_caballo_calc", pm.environment.get("codigo_caballo") + "-CALC");
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201", function () {
          pm.response.to.have.status(201);
      });
      pm.environment.set("id_caballo_calc", pm.response.json().id);
order: 1000
