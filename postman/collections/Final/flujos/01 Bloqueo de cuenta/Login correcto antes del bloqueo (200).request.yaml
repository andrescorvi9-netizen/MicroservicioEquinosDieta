$kind: http-request
name: "Login correcto antes del bloqueo (200)"
description: "Guarda un token para poder eliminar la cuenta en la limpieza, ya que despues queda bloqueada 15 minutos."
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo_bloqueo}}",
      "password": "EquinoDietaPrueba7319Xq"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.environment.set("token_bloqueo", pm.response.json().token);
order: 2000
