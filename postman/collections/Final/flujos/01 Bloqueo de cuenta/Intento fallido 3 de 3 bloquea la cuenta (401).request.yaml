$kind: http-request
name: "Intento fallido 3 de 3 bloquea la cuenta (401)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo_bloqueo}}",
      "password": "incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(401);
          pm.expect(b).to.have.property("mensaje");
      });
      pm.test("Avisa del bloqueo de 15 minutos", function () {
          pm.expect(pm.response.json().mensaje).to.include("bloqueada").and.include("15");
      });
order: 5000
