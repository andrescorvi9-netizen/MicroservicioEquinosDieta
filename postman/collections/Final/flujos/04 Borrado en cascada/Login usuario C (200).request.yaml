$kind: http-request
name: "Login usuario C (200)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo_c}}",
      "password": "EquinoDietaPrueba7319Xq"
    }
auth:
  type: noauth
scripts:
