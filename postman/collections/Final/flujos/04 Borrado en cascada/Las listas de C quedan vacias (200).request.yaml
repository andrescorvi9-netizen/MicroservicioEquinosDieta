$kind: http-request
name: "Las listas de C quedan vacias (200)"
url: "{{caballos_url}}/api/caballos?page=0&size=10"
method: GET
queryParams:
  - key: "page"
    value: "0"
  - key: "size"
    value: "10"
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_c}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("0 caballos", function () {
          pm.expect(pm.response.json().totalElementos).to.eql(0);
      });
order: 8000
