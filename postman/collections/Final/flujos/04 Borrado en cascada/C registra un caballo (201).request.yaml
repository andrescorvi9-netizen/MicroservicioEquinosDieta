$kind: http-request
name: "C registra un caballo (201)"
url: "{{caballos_url}}/api/caballos"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Caballo Cascada",
      "codigo": "{{codigo_caballo}}-CASC",
      "pesoKg": 300,
      "categoria": "potrillo",
      "estadoSalud": "deshidratacion"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_c}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201", function () {
          pm.response.to.have.status(201);
      });
      pm.environment.set("id_caballo_c", pm.response.json().id);
order: 3000
