$kind: http-request
name: "Eliminar el usuario C (204)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario_c}}"
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_c}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 204", function () {
          pm.response.to.have.status(204);
      });
order: 5000
