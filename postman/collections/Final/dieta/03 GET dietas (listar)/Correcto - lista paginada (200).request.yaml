$kind: http-request
name: "Correcto - lista paginada (200)"
url: "{{dietas_url}}/api/dietas?page=0&size=10"
method: GET
queryParams:
  - key: "page"
    value: "0"
  - key: "size"
    value: "10"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Contiene la dieta generada", function () {
          const b = pm.response.json();
          pm.expect(b.totalElementos).to.eql(1);
          pm.expect(b.contenido[0].id).to.eql(Number(pm.environment.get("id_dieta")));
      });
order: 1000
