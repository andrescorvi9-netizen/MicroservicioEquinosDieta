$kind: http-request
name: "Error - caballo inexistente (404)"
url: "{{dietas_url}}/api/dietas"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "caballoId": 999999999
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(404);
          pm.expect(b).to.have.property("mensaje");
      });
order: 2000
