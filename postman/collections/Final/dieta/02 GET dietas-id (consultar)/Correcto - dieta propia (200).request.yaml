$kind: http-request
name: "Correcto - dieta propia (200)"
url: "{{dietas_url}}/api/dietas/{{id_dieta}}"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Trae perfil y racion", function () {
          const b = pm.response.json();
          pm.expect(b.id).to.eql(Number(pm.environment.get("id_dieta")));
          pm.expect(b.perfil.categoria).to.eql("adulto");
          pm.expect(b.perfil.estadoSalud).to.eql("laminitis");
      });
order: 1000
