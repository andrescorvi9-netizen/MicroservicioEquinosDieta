$kind: http-request
name: "Correcto - otro usuario no ve dietas de ese caballo (200 vacio)"
url: "{{dietas_url}}/api/dietas/caballo/{{id_caballo}}"
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{token_b}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Pagina vacia", function () {
          pm.expect(pm.response.json().totalElementos).to.eql(0);
      });
order: 2000
