$kind: http-request
name: "Error - dieta inexistente (404)"
url: "{{dietas_url}}/api/dietas/999999999/regeneracion"
method: POST
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(404);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
