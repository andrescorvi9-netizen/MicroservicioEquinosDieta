$kind: http-request
name: "Error - observaciones de mas de 2000 caracteres (400)"
url: "{{dietas_url}}/api/dietas/{{id_dieta}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "observaciones": "{{obs_larga}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.variables.set("obs_larga", "x".repeat(2001));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 2000
