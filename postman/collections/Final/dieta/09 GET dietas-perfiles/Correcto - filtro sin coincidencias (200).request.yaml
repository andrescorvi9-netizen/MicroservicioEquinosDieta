$kind: http-request
name: "Correcto - filtro sin coincidencias (200)"
url: "{{dietas_url}}/api/dietas/perfiles?categoria=anciano"
method: GET
queryParams:
  - key: "categoria"
    value: "anciano"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Lista vacia", function () {
          pm.expect(pm.response.json().length).to.eql(0);
      });
order: 3000
