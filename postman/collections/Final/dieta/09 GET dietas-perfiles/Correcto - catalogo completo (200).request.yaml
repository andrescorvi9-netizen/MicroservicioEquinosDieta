$kind: http-request
name: "Correcto - catalogo completo (200)"
url: "{{dietas_url}}/api/dietas/perfiles"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("El catalogo tiene 15 perfiles", function () {
          pm.expect(pm.response.json().length).to.eql(15);
      });
order: 1000
