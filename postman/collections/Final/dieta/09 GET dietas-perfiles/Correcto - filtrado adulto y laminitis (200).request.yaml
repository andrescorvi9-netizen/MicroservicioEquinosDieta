$kind: http-request
name: "Correcto - filtrado adulto y laminitis (200)"
url: "{{dietas_url}}/api/dietas/perfiles?categoria=adulto&estado=laminitis"
method: GET
queryParams:
  - key: "categoria"
    value: "adulto"
  - key: "estado"
    value: "laminitis"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Un perfil con 1.5% del peso y 95/5", function () {
          const p = pm.response.json();
          pm.expect(p.length).to.eql(1);
          pm.expect(p[0].porcentajeMateriaSecaDelPeso).to.eql(1.5);
          pm.expect(p[0].porcentajeForraje).to.eql(95);
          pm.expect(p[0].porcentajeConcentrado).to.eql(5);
      });
order: 2000
