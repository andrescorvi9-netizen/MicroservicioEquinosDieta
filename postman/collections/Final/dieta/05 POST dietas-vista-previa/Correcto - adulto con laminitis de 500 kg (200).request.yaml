$kind: http-request
name: "Correcto - adulto con laminitis de 500 kg (200)"
url: "{{dietas_url}}/api/dietas/vista-previa"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "categoria": "adulto",
      "estadoSalud": "laminitis",
      "pesoKg": 500.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Racion 7.5 / 7.12 / 0.38 kg", function () {
          const r = pm.response.json().racion;
          pm.expect(r.materiaSecaTotalKgDia).to.eql(7.5);
          pm.expect(r.forrajeKgDia).to.eql(7.12);
          pm.expect(r.concentradoKgDia).to.eql(0.38);
      });
      pm.test("Incluye el aviso", function () {
          pm.expect(pm.response.json().aviso).to.include("No es un diagnóstico veterinario");
      });
order: 1000
