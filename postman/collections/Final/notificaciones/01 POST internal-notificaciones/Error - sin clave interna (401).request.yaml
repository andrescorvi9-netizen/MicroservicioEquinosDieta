$kind: http-request
name: "Error - sin clave interna (401)"
url: "{{notificaciones_url}}/api/internal/notificaciones"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo_notificacion}}",
      "nombre": "Prueba Postman",
      "tipo": "BIENVENIDA"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Devuelve el mensaje de error", function () {
          pm.expect(pm.response.json().mensaje).to.include("X-Internal-Key");
      });
order: 5000
