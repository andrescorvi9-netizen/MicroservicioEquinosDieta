$kind: http-request
name: "Error - correo invalido (400)"
url: "{{notificaciones_url}}/api/internal/notificaciones"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "X-Internal-Key"
    value: "{{internal_key}}"
body:
  type: json
  content: |-
    {
      "correo": "correo-invalido",
      "nombre": "Prueba Postman",
      "tipo": "BIENVENIDA"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Devuelve el mensaje de error", function () {
          pm.expect(pm.response.json().mensaje).to.include("Los datos enviados no son");
      });
      pm.test("Senala el campo correo", function () {
          pm.expect(pm.response.json().detalles.join(" ")).to.include("correo");
      });
order: 7000
