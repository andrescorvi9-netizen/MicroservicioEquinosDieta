$kind: http-request
name: "Correcto - buscar por codigo en minusculas (200)"
url: "{{caballos_url}}/api/caballos/codigo/{{codigo_caballo_min}}"
method: GET
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("codigo_caballo_min", pm.environment.get("codigo_caballo").toLowerCase());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Encuentra el caballo", function () {
          pm.expect(pm.response.json().id).to.eql(Number(pm.environment.get("id_caballo")));
      });
order: 1000
