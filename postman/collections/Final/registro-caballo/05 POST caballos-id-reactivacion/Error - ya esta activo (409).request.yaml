$kind: http-request
name: "Error - ya esta activo (409)"
url: "{{caballos_url}}/api/caballos/{{id_caballo_2}}/reactivacion"
method: POST
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(409);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
