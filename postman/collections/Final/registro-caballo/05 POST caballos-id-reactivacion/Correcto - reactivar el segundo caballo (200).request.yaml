$kind: http-request
name: "Correcto - reactivar el segundo caballo (200)"
url: "{{caballos_url}}/api/caballos/{{id_caballo_2}}/reactivacion"
method: POST
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Vuelve a estar activo", function () {
          pm.expect(pm.response.json().activo).to.eql(true);
      });
order: 2000
