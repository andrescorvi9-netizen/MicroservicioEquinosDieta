$kind: http-request
name: "Error - datos invalidos (400)"
url: "{{caballos_url}}/api/caballos/{{id_caballo}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Trueno",
      "codigo": "{{codigo_caballo}}",
      "pesoKg": 2500,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 2000
