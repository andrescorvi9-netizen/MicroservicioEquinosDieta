$kind: http-request
name: "Correcto - actualizar caballo (200)"
url: "{{caballos_url}}/api/caballos/{{id_caballo}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Trueno II",
      "codigo": "{{codigo_caballo}}",
      "pesoKg": 510.0,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Datos actualizados", function () {
          const b = pm.response.json();
          pm.expect(b.nombre).to.eql("Trueno II");
          pm.expect(b.pesoKg).to.eql(510);
      });
order: 1000
