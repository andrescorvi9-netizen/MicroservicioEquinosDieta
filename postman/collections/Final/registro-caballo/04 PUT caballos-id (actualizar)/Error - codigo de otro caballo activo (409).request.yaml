$kind: http-request
name: "Error - codigo de otro caballo activo (409)"
url: "{{caballos_url}}/api/caballos/{{id_caballo}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Trueno II",
      "codigo": "{{codigo_caballo_2}}",
      "pesoKg": 510.0,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(409);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
