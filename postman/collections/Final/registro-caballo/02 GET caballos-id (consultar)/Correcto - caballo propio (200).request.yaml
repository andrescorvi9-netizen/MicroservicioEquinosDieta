$kind: http-request
name: "Correcto - caballo propio (200)"
url: "{{caballos_url}}/api/caballos/{{id_caballo}}"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Es el caballo registrado", function () {
          pm.expect(pm.response.json().nombre).to.eql("Trueno");
      });
order: 1000
