$kind: http-request
name: "Correcto - adulto con laminitis (200)"
url: "{{caballos_url}}/api/caballos/busqueda?categoria=adulto&estado=laminitis&page=0&size=10"
method: GET
queryParams:
  - key: "categoria"
    value: "adulto"
  - key: "estado"
    value: "laminitis"
  - key: "page"
    value: "0"
  - key: "size"
    value: "10"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Pagina filtrada", function () {
          const b = pm.response.json();
          pm.expect(b).to.have.all.keys("contenido", "pagina", "tamano", "totalElementos", "totalPaginas");
          pm.expect(b.totalElementos).to.eql(1);
          b.contenido.forEach(c => { pm.expect(c.categoria).to.eql("adulto"); pm.expect(c.estadoSalud).to.eql("laminitis"); });
      });
order: 1000
