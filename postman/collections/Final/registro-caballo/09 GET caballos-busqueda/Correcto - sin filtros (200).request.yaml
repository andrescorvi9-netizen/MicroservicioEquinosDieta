$kind: http-request
name: "Correcto - sin filtros (200)"
url: "{{caballos_url}}/api/caballos/busqueda?page=0&size=10"
method: GET
queryParams:
  - key: "page"
    value: "0"
  - key: "size"
    value: "10"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Trae los 2 caballos", function () {
          pm.expect(pm.response.json().totalElementos).to.eql(2);
      });
order: 2000
