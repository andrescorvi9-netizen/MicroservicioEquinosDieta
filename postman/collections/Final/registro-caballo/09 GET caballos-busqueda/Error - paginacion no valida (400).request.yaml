$kind: http-request
name: "Error - paginacion no valida (400)"
url: "{{caballos_url}}/api/caballos/busqueda?page=-1&size=10"
method: GET
queryParams:
  - key: "page"
    value: "-1"
  - key: "size"
    value: "10"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 4000
