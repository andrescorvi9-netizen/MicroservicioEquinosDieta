$kind: http-request
name: "Correcto - registrar caballo (201)"
url: "{{caballos_url}}/api/caballos"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Trueno",
      "codigo": "{{codigo_caballo}}",
      "pesoKg": 500.0,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Caballo activo con los datos enviados", function () {
          const b = pm.response.json();
          pm.expect(b.id).to.be.a("number");
          pm.expect(b.activo).to.eql(true);
          pm.expect(b.codigo).to.eql(pm.environment.get("codigo_caballo"));
          pm.expect(b.categoria).to.eql("adulto");
          pm.expect(b.estadoSalud).to.eql("laminitis");
      });
      pm.environment.set("id_caballo", pm.response.json().id);
order: 1000
