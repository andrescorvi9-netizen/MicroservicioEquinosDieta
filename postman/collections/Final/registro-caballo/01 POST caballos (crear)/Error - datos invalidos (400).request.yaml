$kind: http-request
name: "Error - datos invalidos (400)"
url: "{{caballos_url}}/api/caballos"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "",
      "codigo": "codigo con espacios",
      "pesoKg": 0,
      "categoria": "adulto",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
      pm.test("Lista nombre, codigo y pesoKg", function () {
          const d = pm.response.json().detalles.join(" ");
          pm.expect(d).to.include("nombre").and.include("codigo").and.include("pesoKg");
      });
order: 3000
