$kind: http-request
name: "Error - categoria no valida (400)"
url: "{{caballos_url}}/api/caballos"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Rayo",
      "codigo": "{{codigo_caballo}}-X",
      "pesoKg": 400,
      "categoria": "anciano",
      "estadoSalud": "laminitis"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 4000
