$kind: http-request
name: "Correcto - correo ya registrado (200)"
url: "{{usuarios_url}}/api/usuarios/disponibilidad?correo={{correo}}"
method: GET
queryParams:
  - key: "correo"
    value: "{{correo}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("disponible = false y correo normalizado", function () {
          const b = pm.response.json();
          pm.expect(b.disponible).to.eql(false);
          pm.expect(b.correo).to.eql(pm.environment.get("correo"));
      });
order: 2000
