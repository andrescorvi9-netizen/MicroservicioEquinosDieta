$kind: http-request
name: "Error - contrasena actual incorrecta (401)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario}}/password"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "passwordActual": "NoEsLaClave1",
      "passwordNueva": "EquinoDietaNueva8426Zk"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(401);
          pm.expect(b).to.have.property("mensaje");
      });
order: 1000
