$kind: http-request
name: "Error - nueva demasiado corta (400)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario}}/password"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "passwordActual": "{{password}}",
      "passwordNueva": "123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
