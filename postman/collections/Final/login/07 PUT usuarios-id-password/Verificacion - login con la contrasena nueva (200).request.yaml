$kind: http-request
name: "Verificacion - login con la contrasena nueva (200)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.environment.set("token", pm.response.json().token);
order: 6000
