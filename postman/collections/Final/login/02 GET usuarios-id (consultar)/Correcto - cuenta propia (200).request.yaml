$kind: http-request
name: "Correcto - cuenta propia (200)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario}}"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Es la cuenta propia", function () {
          const b = pm.response.json();
          pm.expect(b.id).to.eql(Number(pm.environment.get("id_usuario")));
          pm.expect(b.nombre).to.eql("Ana Torres");
      });
order: 1000
