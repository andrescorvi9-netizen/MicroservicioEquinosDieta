$kind: http-request
name: "Correcto - login usuario A (200)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Entrega un token Bearer del usuario A", function () {
          const b = pm.response.json();
          pm.expect(b.tipo).to.eql("Bearer");
          pm.expect(b.token).to.be.a("string").and.not.empty;
          pm.expect(b.usuario.id).to.eql(Number(pm.environment.get("id_usuario")));
      });
      pm.environment.set("token", pm.response.json().token);
order: 1000
