$kind: http-request
name: "Error - cuerpo incompleto (400)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "{{correo}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(400);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
