$kind: http-request
name: "Error - correo no registrado (401)"
url: "{{usuarios_url}}/api/auth/login"
method: POST
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "correo": "nadie.{{ts}}@correo.com",
      "password": "EquinoDietaPrueba7319Xq"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(401);
          pm.expect(b).to.have.property("mensaje");
      });
order: 2000
