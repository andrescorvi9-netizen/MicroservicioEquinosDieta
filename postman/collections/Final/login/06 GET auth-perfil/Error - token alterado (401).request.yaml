$kind: http-request
name: "Error - token alterado (401)"
url: "{{usuarios_url}}/api/auth/perfil"
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: "token.invalido.123"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 401", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(401);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
