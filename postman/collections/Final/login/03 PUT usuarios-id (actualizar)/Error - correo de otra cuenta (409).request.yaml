$kind: http-request
name: "Error - correo de otra cuenta (409)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Ana",
      "correo": "{{correo_b}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Cuerpo de error uniforme", function () {
          const b = pm.response.json();
          pm.expect(b.status).to.eql(409);
          pm.expect(b).to.have.property("mensaje");
      });
order: 3000
