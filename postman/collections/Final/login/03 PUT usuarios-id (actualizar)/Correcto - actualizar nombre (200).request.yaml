$kind: http-request
name: "Correcto - actualizar nombre (200)"
url: "{{usuarios_url}}/api/usuarios/{{id_usuario}}"
method: PUT
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nombre": "Ana Maria Torres",
      "correo": "{{correo}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Nombre actualizado", function () {
          pm.expect(pm.response.json().nombre).to.eql("Ana Maria Torres");
      });
order: 1000
